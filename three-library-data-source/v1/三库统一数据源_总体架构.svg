<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1290" viewBox="0 0 1600 1290" role="img" aria-labelledby="title desc">
  <title id="title">三库统一数据源：目标总体架构</title>
  <desc id="desc">各业务应用保留审批与展示规则，通过统一接口按权限读写素材、提示词和技能。筛选不影响已有引用，旧任务沿用原内容或版本。统一身份支撑鉴权，变更通知仅刷新列表与当前状态。此图为规划方案。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#faf9f7"/><stop offset="1" stop-color="#f0f3f6"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#7e899b"/></marker>
    <marker id="red-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#d9353f"/></marker>
    <style>
      text {font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#202a3b;}
      .title {font-size:38px;font-weight:700;}
      .heading {font-size:26px;font-weight:700;}
      .body {font-size:23px;}
      .small {font-size:20px;fill:#637084;}
      .tag {font-size:18px;font-weight:700;letter-spacing:2px;fill:#b22a34;}
      .line {fill:none;stroke:#7e899b;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow);}
      .event {fill:none;stroke:#d9353f;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#red-arrow);}
    </style>
  </defs>
  <rect width="1600" height="1290" fill="url(#bg)"/>
  <rect x="72" y="52" width="6" height="43" rx="3" fill="#d9353f"/>
  <text x="98" y="87" class="title">三库统一数据源</text>
  <text x="98" y="123" class="small">一套账号 · 一个权威数据源 · 多业务平台受控读写</text>
  <rect x="1370" y="58" width="158" height="38" rx="19" fill="#f9e9ea"/>
  <text x="1449" y="83" text-anchor="middle" class="tag">目标架构</text>

  <text x="72" y="167" class="small">业务应用层 · 各自保留展示规则、审批与任务执行</text>
  <rect x="72" y="186" width="348" height="104" rx="16" fill="#ffffff" stroke="#dde2e8"/>
  <rect x="438" y="186" width="348" height="104" rx="16" fill="#ffffff" stroke="#dde2e8"/>
  <rect x="804" y="186" width="348" height="104" rx="16" fill="#ffffff" stroke="#dde2e8"/>
  <text x="246" y="229" class="heading" text-anchor="middle">AI 设计平台</text>
  <text x="246" y="265" class="small" text-anchor="middle">上传 · 编辑 · 选择 · 使用</text>
  <text x="612" y="229" class="heading" text-anchor="middle">XMAI Studio</text>
  <text x="612" y="265" class="small" text-anchor="middle">导入 · 管理 · 引用 · 执行</text>
  <text x="978" y="229" class="heading" text-anchor="middle">其他业务应用</text>
  <text x="978" y="265" class="small" text-anchor="middle">业务页面 · Agent · 自动化</text>

  <path d="M246 290 V316 H978 V290 M612 290 V356" fill="none" stroke="#7e899b" stroke-width="2"/>
  <path d="M612 326 V358" class="line"/>
  <text x="646" y="347" class="small">查询 / 新增 / 修改 / 删除 / 发布结果写入</text>

  <rect x="72" y="370" width="1120" height="714" rx="22" fill="#ffffff" stroke="#dce1e8"/>
  <rect x="72" y="370" width="1120" height="5" rx="2.5" fill="#d9353f"/>
  <text x="108" y="414" class="heading">统一三库资产中心</text>
  <text x="1154" y="413" class="small" text-anchor="end">资产读写统一 · 业务规则由应用负责</text>

  <rect x="108" y="440" width="1048" height="82" rx="12" fill="#fbeef0"/>
  <text x="132" y="474" class="heading">统一接入服务</text>
  <text x="132" y="505" class="small">应用认证 · 可信用户身份 · 标准读写入口</text>
  <text x="1128" y="487" class="body" text-anchor="end" fill="#a12832">资产读写从这里进入</text>

  <path d="M632 528 V550" class="line"/>
  <rect x="108" y="560" width="1048" height="91" rx="12" fill="#f3f5f8"/>
  <text x="132" y="596" class="heading">统一数据管理</text>
  <text x="132" y="630" class="body">权限与范围　 /　 条件查询　 /　 内容版本　 /　 引用关系　 /　 操作记录</text>

  <path d="M632 657 V686" class="line"/>
  <rect x="108" y="696" width="336" height="137" rx="12" fill="#f4f6f9" stroke="#e3e7ed"/>
  <rect x="464" y="696" width="336" height="137" rx="12" fill="#f4f6f9" stroke="#e3e7ed"/>
  <rect x="820" y="696" width="336" height="137" rx="12" fill="#f4f6f9" stroke="#e3e7ed"/>
  <text x="132" y="735" class="heading">素材服务</text>
  <text x="132" y="773" class="body">图片 · 视频 · 音频</text>
  <text x="132" y="809" class="small">文件管理与受控访问</text>
  <text x="488" y="735" class="heading">提示词服务</text>
  <text x="488" y="773" class="body">正文 · 用途 · 来源</text>
  <text x="488" y="809" class="small">验证标识与跨平台复用</text>
  <text x="844" y="735" class="heading">技能服务</text>
  <text x="844" y="773" class="body">技能包 · 发布快照</text>
  <text x="844" y="809" class="small">包内容、版本与运行要求</text>

  <path d="M276 839 V874" class="line"/>
  <path d="M632 839 V874" class="line"/>
  <path d="M988 839 V874" class="line"/>
  <rect x="108" y="886" width="1048" height="152" rx="14" fill="#253347"/>
  <text x="132" y="928" class="heading" style="fill:#ffffff">统一权威数据源</text>
  <text x="132" y="967" class="body" style="fill:#e9edf4">资产信息与权限　 ·　 文件、正文与技能包　 ·　 内容版本与发布记录</text>
  <text x="132" y="1009" class="small" style="fill:#bfcada">个人与共享关系　 /　 业务结果关联与资产引用　 /　 操作记录</text>
  <text x="108" y="1066" class="small">三库统一读写与引用规则；内容类型分别管理，审批保留在业务端。</text>

  <text x="1236" y="410" class="small">横向支撑</text>
  <rect x="1236" y="440" width="288" height="215" rx="16" fill="#ffffff" stroke="#dde2e8"/>
  <text x="1260" y="481" class="heading">统一身份与组织</text>
  <text x="1260" y="524" class="body">复用现有账号体系</text>
  <text x="1260" y="562" class="small">账号状态 · 用户 · 组织</text>
  <text x="1260" y="600" class="small">角色与授权映射</text>
  <text x="1260" y="632" class="small">支撑身份与资产权限校验</text>
  <path d="M1230 482 H1164" fill="none" stroke="#7e899b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1230 608 H1164" fill="none" stroke="#7e899b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1236" y="748" width="288" height="250" rx="16" fill="#ffffff" stroke="#dde2e8"/>
  <text x="1260" y="792" class="heading">变更通知与对账</text>
  <text x="1260" y="838" class="body">发布 · 下架 · 撤权</text>
  <text x="1260" y="879" class="small">刷新列表与当前资产状态</text>
  <text x="1260" y="914" class="small">不自动改写旧任务输入</text>
  <text x="1260" y="970" class="small">最新权限仍由服务端校验</text>
  <path d="M1162 949 H1208 V838 H1228" class="event"/>
  <path d="M1524 792 H1552 V316 H990" class="event"/>
  <rect x="1280" y="294" width="193" height="43" rx="8" fill="#faf1f1"/>
  <text x="1376" y="322" class="small" text-anchor="middle" style="fill:#b22a34">通知各应用刷新</text>

  <rect x="72" y="1108" width="1452" height="110" rx="14" fill="#ffffff" stroke="#dde2e8"/>
  <text x="100" y="1146" class="heading">三库共同规则</text>
  <text x="325" y="1146" class="body">列表按权限与业务条件筛选，已有引用不受展示过滤影响。</text>
  <text x="325" y="1189" class="body">旧任务重跑：提示词沿用原正文 · 素材沿用原文件版本 · 技能沿用原技能包版本。</text>

  <path d="M76 1256 H115" stroke="#7e899b" stroke-width="2"/>
  <text x="126" y="1263" class="small">实线：读写 / 身份校验</text>
  <path d="M415 1256 H454" stroke="#d9353f" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="465" y="1263" class="small">虚线：变更通知</text>
  <text x="1524" y="1263" class="small" text-anchor="end">规划展示 · 不代表已上线　｜　2026.09.29</text>
</svg>
