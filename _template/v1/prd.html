<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【项目名称】PRD · 评审版</title>
<!--
  ====================================================================
  使用说明：
  1. 把 PROJECT_ID 改成你的项目标识，格式建议：项目缩写-版本，例如 "crm-v1"
  2. 在 #docContent 里写你的 PRD 正文内容
  3. 按 Supabase 逻辑说明无需改动，直接复用
  ====================================================================
-->
<style>
  /* 把下面的样式替换成你项目的 PRD 样式，或直接复制 pdd/v1/prd.html 的全套样式 */
  :root {
    --blue: #2563eb; --text: #16213a; --muted: #5b6678;
    --line: #e6e9f0; --bg: #f3f6fb; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
  .doc-wrap { max-width: 900px; margin: 0 auto; padding: 40px 32px 80px; }
  #docContent h1 { font-size: 24px; font-weight: 800; margin: 0 0 8px; }
  #docContent h2 { font-size: 18px; font-weight: 700; margin: 32px 0 12px; }
  #docContent p { margin: 0 0 14px; font-size: 14.5px; }

  /* 编辑横幅（嵌入模式下不显示） */
  .edit-banner {
    display: none;
    background: #fef9c3; border-bottom: 1px solid #fde047;
    padding: 8px 20px; font-size: 13px; color: #713f12;
  }
  .edit-banner.show { display: flex; align-items: center; gap: 10px; }
  .edit-banner button {
    padding: 4px 12px; border-radius: 6px; border: 1px solid #ca8a04;
    background: #fff; cursor: pointer; font-size: 12px;
  }

  /* 同步状态 */
  #docSyncStatus { font-size: 12px; color: var(--muted); }

  /* 待确认问题输入框 */
  .answer-input {
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
    font-size: 13px; width: 100%; max-width: 320px; outline: none;
    transition: border-color .15s;
  }
  .answer-input:focus { border-color: var(--blue); }
  .answer-input.saving { opacity: .6; }
  .answer-input.saved { border-color: #16a34a; }

  /* 文档头（嵌入 iframe 时隐藏） */
  .doc-header {
    background: linear-gradient(135deg, #1d3a8f 0%, #2563eb 60%, #3b82f6 100%);
    color: #fff; padding: 22px 36px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .doc-header h1 { margin: 0; font-size: 21px; font-weight: 800; }
</style>
</head>
<body>

  <!-- 嵌入 iframe 时由外层 index.html 提供导航，这里的 header 会自动隐藏 -->
  <div class="doc-header">
    <h1>【项目名称】PRD · 评审版</h1>
    <span id="docSyncStatus">☁️ 加载中…</span>
  </div>

  <div class="edit-banner" id="editBanner">
    ✏️ 编辑模式
    <button id="docSaveBtn" style="display:none">保存</button>
    <button id="docExitBtn" style="display:none">取消</button>
    <button id="docClearBtn" style="display:none">还原</button>
  </div>

  <div class="doc-wrap">
    <!-- 编辑按钮（?edit=mengdie 时出现） -->
    <button id="docEditBtn" style="display:none; margin-bottom:16px; padding:6px 14px; border-radius:8px; border:1px solid #2563eb; color:#2563eb; background:#fff; cursor:pointer; font-size:13px;">✏️ 编辑文档</button>

    <!-- ===== PRD 正文区域 ===== -->
    <div id="docContent">

      <h1>【项目名称】PRD</h1>
      <p>在这里写你的 PRD 正文。可以直接编辑 HTML，也可以通过 <code>?edit=mengdie</code> 模式在浏览器里在线编辑后保存到 Supabase。</p>

      <h2>1. 背景与目标</h2>
      <p>【填写内容】</p>

      <h2>2. 功能说明</h2>
      <p>【填写内容】</p>

      <!-- 待确认问题示例 -->
      <h2>待确认事项</h2>
      <table border="1" style="border-collapse:collapse; width:100%; font-size:13px;">
        <thead>
          <tr><th>编号</th><th>问题</th><th>回复</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>T01</td>
            <td>【待确认问题描述】</td>
            <td><input type="text" class="answer-input" data-answer-id="T01" placeholder="待填写" autocomplete="off"></td>
          </tr>
        </tbody>
      </table>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ====================================================================
    // 只需改这一行：PROJECT_ID = "项目缩写-版本"，例如 "crm-v1"
    // ====================================================================
    const PROJECT_ID = "CHANGE_ME";

    const IS_EMBEDDED = new URLSearchParams(window.location.search).get("embedded") === "true";
    if (IS_EMBEDDED) {
      document.querySelector(".doc-header").style.display = "none";
      document.querySelector(".edit-banner").style.marginTop = "0";
    }

    const SUPABASE_URL = "https://uqqdfomevnoaqsadhvex.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxcWRmb21ldm5vYXFzYWRodmV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNjk0ODksImV4cCI6MjA5NzY0NTQ4OX0.Qqs_Z_rZzCkqIRebE2FMkewKuz9kn_3ErYlcbAcVsz8";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const TABLE = "prd_annotations";
    const PRD_ROW_ID = PROJECT_ID + "-prd-full-content";

    const EDIT_MODE = new URLSearchParams(window.location.search).get("edit") === "mengdie";

    const docContent = document.getElementById("docContent");
    const docSyncStatus = document.getElementById("docSyncStatus");
    const docEditBtn = document.getElementById("docEditBtn");
    const docExitBtn = document.getElementById("docExitBtn");
    const docSaveBtn = document.getElementById("docSaveBtn");
    const docClearBtn = document.getElementById("docClearBtn");
    const editBanner = document.getElementById("editBanner");

    let savedSnapshot = null;

    function setSyncStatus(state) {
      docSyncStatus.classList.remove("editing");
      if (state === "syncing") {
        docSyncStatus.textContent = "☁️ 同步中…";
      } else if (state === "error") {
        docSyncStatus.textContent = "⚠️ 同步失败";
      } else if (state === "editing") {
        docSyncStatus.textContent = "✏️ 编辑中（未保存）";
        docSyncStatus.classList.add("editing");
      } else {
        docSyncStatus.textContent = "☁️ 已连接";
      }
    }

    async function loadPrdContent() {
      if (IS_EMBEDDED) { setSyncStatus("ok"); return; }
      setSyncStatus("syncing");
      const { data, error } = await supabaseClient
        .from(TABLE).select("body").eq("id", PRD_ROW_ID).eq("type", "prd-content").maybeSingle();
      if (error) { console.warn("加载云端PRD内容失败", error); setSyncStatus("error"); return; }
      if (data && data.body) docContent.innerHTML = data.body;
      setSyncStatus("ok");
    }

    if (EDIT_MODE) docEditBtn.style.display = "";

    docEditBtn.addEventListener("click", () => {
      docContent.setAttribute("contenteditable", "true");
      docContent.focus();
      docEditBtn.style.display = "none";
      docExitBtn.style.display = "";
      docSaveBtn.style.display = "";
      docClearBtn.style.display = "";
      editBanner.classList.add("show");
      setSyncStatus("editing");
    });

    function exitEditUI() {
      docContent.removeAttribute("contenteditable");
      docEditBtn.style.display = "";
      docExitBtn.style.display = "none";
      docSaveBtn.style.display = "none";
      docClearBtn.style.display = "none";
      editBanner.classList.remove("show");
    }

    docExitBtn.addEventListener("click", () => {
      docContent.innerHTML = savedSnapshot;
      bindAnswerInputs(); loadAnswers();
      exitEditUI(); setSyncStatus("ok");
    });
    docClearBtn.addEventListener("click", () => {
      docContent.innerHTML = savedSnapshot;
      bindAnswerInputs(); loadAnswers();
    });

    docSaveBtn.addEventListener("click", async () => {
      setSyncStatus("syncing");
      const html = docContent.innerHTML;
      const { error } = await supabaseClient.from(TABLE).upsert({
        id: PRD_ROW_ID, type: "prd-content", body: html, updated_at: new Date().toISOString(),
      });
      if (error) {
        console.warn("保存失败", error); setSyncStatus("error");
        alert("同步失败，请检查网络后重试"); return;
      }
      savedSnapshot = html; exitEditUI(); setSyncStatus("ok");
    });

    async function loadAnswers() {
      const { data, error } = await supabaseClient
        .from(TABLE).select("id, body").eq("type", "prd-answer").like("id", PROJECT_ID + "-%");
      if (error) { console.warn("加载确认回复失败", error); return; }
      const map = {};
      (data || []).forEach((row) => { map[row.id.slice(PROJECT_ID.length + 1)] = row.body; });
      document.querySelectorAll(".answer-input").forEach((input) => {
        const val = map[input.dataset.answerId];
        if (val) input.value = val;
      });
    }

    async function saveAnswer(input) {
      input.classList.remove("saved"); input.classList.add("saving");
      const { error } = await supabaseClient.from(TABLE).upsert({
        id: PROJECT_ID + "-" + input.dataset.answerId,
        type: "prd-answer", body: input.value, updated_at: new Date().toISOString(),
      });
      input.classList.remove("saving");
      if (error) { console.warn("保存确认回复失败", error); return; }
      input.classList.add("saved");
      setTimeout(() => input.classList.remove("saved"), 1500);
    }

    let answerSaveTimers = {};
    function bindAnswerInputs() {
      document.querySelectorAll(".answer-input").forEach((input) => {
        input.addEventListener("blur", () => saveAnswer(input));
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); input.blur(); } });
        input.addEventListener("input", () => {
          clearTimeout(answerSaveTimers[input.dataset.answerId]);
          answerSaveTimers[input.dataset.answerId] = setTimeout(() => saveAnswer(input), 1200);
        });
      });
    }

    (async () => {
      await loadPrdContent();
      savedSnapshot = docContent.innerHTML;
      bindAnswerInputs();
      await loadAnswers();
    })();
  </script>
</body>
</html>
