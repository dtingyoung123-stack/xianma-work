<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>先马·Centaur 搜索页原型</title>
<style>
  :root{
    --bg-page:#e9eaec;
    --bg-window:#ffffff;
    --bg-sidebar:#f7f7f8;
    --text:#1c2128;
    --text-dim:#6b7280;
    --text-faint:#9aa0a6;
    --border:#e5e7eb;
    --accent:#e0231a;
    --accent-soft:#fdeceb;
    --hover:#eceef0;
    --active:#eef0f2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg-page);
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  }
  .window{
    width:1280px;height:820px;background:var(--bg-window);border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,0.18);overflow:hidden;display:flex;flex-direction:column;
  }
  .titlebar{height:36px;display:flex;align-items:center;padding:0 16px;gap:8px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .dot{width:12px;height:12px;border-radius:50%;}
  .dot.red{background:#ff5f57;} .dot.yellow{background:#febc2e;} .dot.green{background:#28c840;}
  .body{flex:1;display:flex;min-height:0;}

  /* 侧边栏(与主对话页一致) */
  .sidebar{width:260px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;}
  .brand{display:flex;align-items:center;gap:8px;padding:4px 8px 16px;}
  .brand img{width:24px;height:24px;object-fit:contain;}
  .brand span{font-size:14px;font-weight:600;color:var(--text);}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:14px;color:var(--text);cursor:pointer;}
  .nav-item:hover{background:var(--hover);}
  .nav-item.current{background:var(--active);font-weight:600;}
  .nav-item .icon{width:18px;text-align:center;font-size:15px;}
  .nav-item .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;line-height:1;padding:3px 6px;border-radius:20px;}
  .section-label{font-size:12px;color:var(--text-faint);padding:18px 10px 6px;}
  .project-group{margin-bottom:4px;}
  .project-title{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;}
  .project-title:hover{background:var(--hover);}
  .history-list{padding-left:8px;}
  .history-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--text-dim);cursor:pointer;white-space:nowrap;overflow:hidden;}
  .history-item:hover{background:var(--hover);}
  .history-item .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history-item .time{flex-shrink:0;font-size:11px;color:var(--text-faint);margin-left:8px;}
  .expand-link{padding:6px 10px;font-size:12px;color:var(--text-faint);cursor:pointer;}
  .sidebar-spacer{flex:1;}
  .account{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;}
  .account:hover{background:var(--hover);}
  .account .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}
  .account .who{display:flex;flex-direction:column;}
  .account .who .name{font-size:13px;color:var(--text);}
  .account .who .sub{font-size:11px;color:var(--text-faint);}

  /* 通用交互:toast / 账户菜单 / 设置面板 */
  .toast-host{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
  .toast{background:rgba(28,33,40,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transform:translateY(-8px);transition:opacity .2s ease,transform .2s ease;}
  .toast.show{opacity:1;transform:translateY(0);}
  .account-wrap{position:relative;}
  .acct-menu{position:absolute;left:0;bottom:calc(100% + 6px);width:210px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:6px;display:none;z-index:60;}
  .acct-menu.open{display:block;}
  .acct-menu .am-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--text);cursor:pointer;}
  .acct-menu .am-item:hover{background:var(--hover);}
  .acct-menu .am-item.danger{color:var(--accent);}
  .acct-menu .am-item .am-ic{width:18px;text-align:center;}
  .acct-menu .am-sep{height:1px;background:var(--border);margin:4px 2px;}
  .st-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:200;}
  .st-overlay.show{display:flex;}
  .settings-panel{width:520px;max-width:92vw;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden;}
  .sp-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
  .sp-head h3{margin:0;font-size:16px;font-weight:600;color:var(--text);}
  .sp-close{cursor:pointer;color:var(--text-faint);font-size:20px;line-height:1;}
  .sp-close:hover{color:var(--text);}
  .sp-body{padding:20px 22px;}
  .sp-row{margin-bottom:20px;}.sp-row:last-child{margin-bottom:0;}
  .sp-row .sp-label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;}
  .sp-row .sp-hint{font-size:12px;color:var(--text-faint);margin-top:6px;}
  .sp-seg{display:flex;gap:8px;flex-wrap:wrap;}
  .sp-pill{padding:7px 14px;border:1px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;color:var(--text-dim);}
  .sp-pill.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .sp-input{width:100%;height:40px;border:1px solid var(--border);border-radius:8px;padding:0 12px;font-size:13.5px;color:var(--text);outline:none;}
  .sp-input:focus{border-color:var(--accent);}
  .sp-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--border);}
  .sp-btn{height:38px;padding:0 18px;border-radius:8px;border:none;font-size:13.5px;cursor:pointer;}
  .sp-btn.ghost{background:var(--hover);color:var(--text-dim);}
  .sp-btn.primary{background:var(--text);color:#fff;}

  /* 主区域:搜索 */
  .main{flex:1;overflow-y:auto;padding:36px 48px;}
  h1{font-size:28px;font-weight:700;color:var(--text);margin:0 0 6px;}
  .subtitle{font-size:14px;color:var(--text-dim);margin:0 0 24px;}
  .search-box{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--border);border-radius:12px;
    padding:13px 16px;max-width:620px;margin-bottom:28px;background:#fff;
  }
  .search-box:focus-within{border-color:var(--accent);}
  .search-box input{border:none;outline:none;font-size:15px;flex:1;color:var(--text);}
  .search-box input::placeholder{color:var(--text-faint);}
  .search-box .clear{cursor:pointer;color:var(--text-faint);font-size:16px;display:none;}
  .search-box .clear:hover{color:var(--text);}

  .res-group{margin-bottom:26px;max-width:760px;}
  .res-group .rg-title{font-size:12px;font-weight:600;color:var(--text-faint);letter-spacing:.5px;margin-bottom:10px;}
  .res-item{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;border:1px solid var(--border);border-radius:12px;
    background:#fff;margin-bottom:10px;cursor:pointer;text-decoration:none;
  }
  .res-item:hover{border-color:var(--accent);background:var(--accent-soft);}
  .res-item .ri-icon{
    width:38px;height:38px;border-radius:9px;background:var(--accent-soft);
    color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
  }
  .res-item .ri-body{flex:1;min-width:0;}
  .res-item .ri-name{font-size:14px;font-weight:600;color:var(--text);}
  .res-item .ri-desc{font-size:12.5px;color:var(--text-dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .res-item .ri-tag{font-size:11px;color:var(--text-faint);flex-shrink:0;}
  .res-item mark{background:#ffe9a8;color:inherit;border-radius:2px;padding:0 1px;}

  .empty{max-width:620px;padding:40px 0;text-align:center;color:var(--text-faint);font-size:14px;}
  .empty .em-ic{font-size:34px;display:block;margin-bottom:12px;}

  .note{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:12px;color:#9aa0a6;}
/* 历史对话删除按钮 */
  .history-item{position:relative;}
  .history-item .hist-del{flex-shrink:0;margin-left:6px;width:18px;height:18px;border-radius:5px;display:none;align-items:center;justify-content:center;font-size:13px;line-height:1;color:var(--text-faint);}
  .history-item:hover .hist-del{display:flex;}
  .history-item:hover .time{display:none;}
  .history-item .hist-del:hover{background:var(--accent-soft);color:var(--accent);}
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
  </div>

  <div class="body">
    <div class="sidebar">
      <div class="brand">
        <img src="icon.png" alt="先马·Centaur">
        <span>先马·Centaur</span>
      </div>
      <div class="nav-item" onclick="location.href='main.html'"><span class="icon">✎</span> 新对话</div>
      <div class="nav-item current"><span class="icon">🔍</span> 搜索</div>
      <div class="nav-item" onclick="location.href='scheduled.html'"><span class="icon">🕐</span> 已安排</div>
      <div class="nav-item" onclick="location.href='skills.html'"><span class="icon">⚡</span> 技能 <span class="badge">4</span></div>

      <div class="section-label">项目</div>
      <div class="project-group">
        <div class="project-title">📁 运营部</div>
        <div class="history-list">
          <div class="history-item" onclick="location.href='result.html?skill=weekly'"><span class="title">本周周报生成</span><span class="time">刚刚</span></div>
          <div class="history-item" onclick="location.href='result.html?skill=copywriting'"><span class="title">618活动文案润色</span><span class="time">2小时</span></div>
          <div class="history-item" onclick="location.href='result.html?skill=meeting'"><span class="title">周会会议记录整理</span><span class="time">昨天</span></div>
        </div>
      </div>
      <div class="project-group">
        <div class="project-title">📁 设计部</div>
        <div class="history-list">
          <div class="history-item" onclick="location.href='result.html?skill=image'"><span class="title">产品图批量去背景</span><span class="time">1周</span></div>
          <div class="history-item" onclick="location.href='result.html?skill=image'"><span class="title">详情页图片格式转换</span><span class="time">1周</span></div>
        </div>
      </div>
      <div class="expand-link" onclick="toast('已展开:原型仅展示部分历史')">展开显示</div>
      <div class="sidebar-spacer"></div>
      <div class="account-wrap">
        <div class="acct-menu" id="acct-menu">
          <div class="am-item" onclick="closeAcctMenu();openSettings()"><span class="am-ic">⚙️</span> 设置</div>
          <div class="am-item" onclick="toast('账户:梦蝶 · 数智中心')"><span class="am-ic">👤</span> 账户信息</div>
          <div class="am-sep"></div>
          <div class="am-item danger" onclick="logout()"><span class="am-ic">↩</span> 退出登录</div>
        </div>
        <div class="account" onclick="toggleAcctMenu(event)">
          <div class="avatar">梦</div>
          <div class="who"><div class="name">梦蝶</div><div class="sub">设置 · 账户</div></div>
        </div>
      </div>
    </div>

    <div class="main">
      <h1>搜索</h1>
      <p class="subtitle">搜索技能、历史任务与已安排任务</p>

      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="q" placeholder="输入关键词,例如“周报”“去背景”“润色”" oninput="doSearch(this.value)" autofocus>
        <span class="clear" id="clear" onclick="clearSearch()">×</span>
      </div>

      <div id="results"></div>
    </div>
  </div>
</div>

<div class="note">原型 · 仅用于内部方案评审,非最终UI</div>

<div class="toast-host" id="toast-host"></div>
<div class="st-overlay" id="st-overlay" onclick="if(event.target===this)closeSettings()">
  <div class="settings-panel">
    <div class="sp-head"><h3>设置</h3><div class="sp-close" onclick="closeSettings()">×</div></div>
    <div class="sp-body">
      <div class="sp-row"><div class="sp-label">外观主题</div><div class="sp-seg"><div class="sp-pill selected" onclick="pickPill(this)">浅色</div><div class="sp-pill" onclick="pickPill(this)">深色</div><div class="sp-pill" onclick="pickPill(this)">跟随系统</div></div></div>
      <div class="sp-row"><div class="sp-label">工作区目录</div><input class="sp-input" value="~/先马Centaur/工作区" readonly><div class="sp-hint">Agent 的读写操作被限定在此目录内(原型展示)</div></div>
      <div class="sp-row"><div class="sp-label">默认模型</div><div class="sp-seg"><div class="sp-pill selected" onclick="pickPill(this)">标准</div><div class="sp-pill" onclick="pickPill(this)">高性能</div></div></div>
    </div>
    <div class="sp-foot"><button class="sp-btn ghost" onclick="closeSettings()">取消</button><button class="sp-btn primary" onclick="closeSettings();toast('设置已保存')">保存</button></div>
  </div>
</div>

<script>
  function toast(msg){
    const host=document.getElementById('toast-host');
    const t=document.createElement('div');t.className='toast';t.textContent=msg;
    host.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),200);},2200);
  }
  function toggleAcctMenu(e){e&&e.stopPropagation();document.getElementById('acct-menu').classList.toggle('open');}
  function closeAcctMenu(){const m=document.getElementById('acct-menu');m&&m.classList.remove('open');}
  function openSettings(){document.getElementById('st-overlay').classList.add('show');}
  function closeSettings(){document.getElementById('st-overlay').classList.remove('show');}
  function pickPill(el){el.parentNode.querySelectorAll('.sp-pill').forEach(p=>p.classList.remove('selected'));el.classList.add('selected');}
  function logout(){location.href='index.html';}
document.addEventListener('click',closeAcctMenu);

  /* 历史对话删除:hover 出×,点×删除该条,不触发条目跳转 */
  function initHistDelete(){
    document.querySelectorAll('.history-item').forEach(item=>{
      if(item.querySelector('.hist-del')) return;
      const del=document.createElement('span');
      del.className='hist-del';del.textContent='×';del.title='删除这条对话';
      del.addEventListener('click',e=>{
        e.stopPropagation();
        const name=(item.querySelector('.title')||{}).textContent||'该对话';
        item.remove();
        if(typeof toast==='function') toast('已删除:'+name);
      });
      item.appendChild(del);
    });
  }
  initHistDelete();

  /* ---- 搜索数据与逻辑 ---- */
  const SKILLS=[
    {icon:'📅',name:'日报 / 周报生成',desc:'选定时间范围,自动整理内容并按模板排版输出',kw:'日报 周报 报告 总结 排版',url:'skill-form.html?skill=weekly'},
    {icon:'🖼️',name:'P图 / 图片处理',desc:'批量去背景、加水印、调整尺寸或转换格式',kw:'图片 p图 去背景 抠图 水印 格式 尺寸',url:'skill-form.html?skill=image'},
    {icon:'✍️',name:'文案润色 / 改写',desc:'调整语气、精简或扩写一段文字',kw:'文案 润色 改写 语气 扩写 精简 文字',url:'skill-form.html?skill=copywriting'},
    {icon:'📝',name:'会议记录整理',desc:'输入文字或转写稿,生成摘要与待办事项清单',kw:'会议 记录 纪要 摘要 待办 todo',url:'skill-form.html?skill=meeting'}
  ];
  const HISTORY=[
    {icon:'📅',name:'本周周报生成',desc:'运营部 · 刚刚',kw:'周报 运营',url:'result.html?skill=weekly'},
    {icon:'✍️',name:'618活动文案润色',desc:'运营部 · 2小时前',kw:'文案 润色 618 活动 运营',url:'result.html?skill=copywriting'},
    {icon:'📝',name:'周会会议记录整理',desc:'运营部 · 昨天',kw:'会议 记录 周会 运营',url:'result.html?skill=meeting'},
    {icon:'🖼️',name:'产品图批量去背景',desc:'设计部 · 1周前',kw:'图片 去背景 产品图 设计',url:'result.html?skill=image'},
    {icon:'🖼️',name:'详情页图片格式转换',desc:'设计部 · 1周前',kw:'图片 格式 转换 详情页 设计',url:'result.html?skill=image'}
  ];
  const SCHEDULED=[
    {icon:'📅',name:'每周一 09:00 自动生成上周周报',desc:'已安排 · 运营部',kw:'周报 定时 每周 自动 运营',url:'scheduled.html'},
    {icon:'📝',name:'每次周会后整理会议纪要',desc:'已安排 · 运营部',kw:'会议 纪要 定时 自动',url:'scheduled.html'}
  ];

  function hl(text,q){
    if(!q) return text;
    const i=text.toLowerCase().indexOf(q.toLowerCase());
    if(i<0) return text;
    return text.slice(0,i)+'<mark>'+text.slice(i,i+q.length)+'</mark>'+text.slice(i+q.length);
  }
  function match(item,q){
    const hay=(item.name+' '+item.desc+' '+item.kw).toLowerCase();
    return hay.includes(q.toLowerCase());
  }
  function groupHtml(title,items,q){
    if(!items.length) return '';
    const rows=items.map(it=>`
      <a class="res-item" href="${it.url}">
        <div class="ri-icon">${it.icon}</div>
        <div class="ri-body">
          <div class="ri-name">${hl(it.name,q)}</div>
          <div class="ri-desc">${it.desc}</div>
        </div>
        <div class="ri-tag">${title}</div>
      </a>`).join('');
    return `<div class="res-group"><div class="rg-title">${title}(${items.length})</div>${rows}</div>`;
  }
  function doSearch(q){
    q=(q||'').trim();
    document.getElementById('clear').style.display=q?'block':'none';
    const box=document.getElementById('results');
    if(!q){
      // 无关键词:展示全部技能作为默认建议
      box.innerHTML=groupHtml('技能',SKILLS,'');
      return;
    }
    const sk=SKILLS.filter(i=>match(i,q));
    const hi=HISTORY.filter(i=>match(i,q));
    const sc=SCHEDULED.filter(i=>match(i,q));
    const html=groupHtml('技能',sk,q)+groupHtml('历史任务',hi,q)+groupHtml('已安排',sc,q);
    box.innerHTML=html||`<div class="empty"><span class="em-ic">🔍</span>没有找到与“${q}”相关的结果<br>换个关键词试试,或直接<a href="main.html">新建对话</a>描述需求</div>`;
  }
  function clearSearch(){const el=document.getElementById('q');el.value='';el.focus();doSearch('');}
  doSearch('');
</script>

</body>
</html>
