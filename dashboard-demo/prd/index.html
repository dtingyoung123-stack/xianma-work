<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="客服 Agent 数据看板增量 PRD V1.0 与业务线开发分册">
  <title>客服 Agent 数据看板 - PRD 文档</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --brand: #D9353F;
      --brand-dark: #B72832;
      --brand-soft: #FFF2F3;
      --ink: #1D232B;
      --text: #343B45;
      --muted: #737D8B;
      --line: #E1E5EA;
      --surface: #FFFFFF;
      --canvas: #F5F7FA;
      --success: #16794C;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, select, a { font: inherit; }
    .doc-header {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      min-height: 64px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 24px;
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid var(--line);
    }
    .doc-title { min-width: 0; }
    .doc-title strong { display: block; color: var(--ink); font-size: 15px; }
    .doc-title span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .status { color: var(--success); font-weight: 650; }
    .actions { display: flex; flex: none; align-items: center; gap: 8px; }
    .action {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      background: #FFFFFF;
      border: 1px solid #CBD1D8;
      border-radius: 6px;
      cursor: pointer;
    }
    .action:hover { color: var(--brand-dark); border-color: var(--brand); }
    .action.primary { color: #FFFFFF; background: var(--brand); border-color: var(--brand); }
    .action.primary:hover { color: #FFFFFF; background: var(--brand-dark); }
    .action:focus-visible, .doc-link:focus-visible, .mobile-doc-select:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }
    .mobile-picker { display: none; padding: 10px 16px; background: #FFFFFF; border-bottom: 1px solid var(--line); }
    .mobile-doc-select { width: 100%; height: 38px; padding: 0 10px; border: 1px solid #CBD1D8; border-radius: 6px; background: #FFFFFF; }
    .layout {
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr);
      width: min(1480px, 100%);
      min-height: calc(100vh - 64px);
      margin: 0 auto;
    }
    .sidebar {
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
      padding: 20px 16px 28px;
      background: #FFFFFF;
      border-right: 1px solid var(--line);
    }
    .sidebar-title {
      margin: 0 8px 9px;
      color: #8A93A0;
      font-size: 11px;
      font-weight: 750;
    }
    .doc-list, .toc-list { display: grid; gap: 3px; }
    .doc-link {
      width: 100%;
      min-height: 34px;
      padding: 7px 10px;
      overflow: hidden;
      color: #4D5663;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: transparent;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }
    .doc-link:hover { color: var(--ink); background: #F2F4F7; }
    .doc-link.active { color: var(--brand-dark); font-weight: 700; background: var(--brand-soft); }
    .divider { height: 1px; margin: 18px 8px; background: var(--line); }
    .toc-link {
      display: block;
      padding: 5px 10px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-left: 2px solid transparent;
    }
    .toc-link.level-3 { padding-left: 22px; }
    .toc-link:hover { color: var(--brand-dark); border-left-color: var(--brand); }
    .content-wrap { min-width: 0; padding: 28px clamp(20px, 4vw, 64px) 64px; }
    .source-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      max-width: 980px;
      margin: 0 auto 18px;
      padding: 10px 12px;
      color: #6F363C;
      background: var(--brand-soft);
      border-left: 3px solid var(--brand);
      font-size: 12px;
      line-height: 1.6;
    }
    .markdown-body {
      max-width: 980px;
      min-height: 70vh;
      margin: 0 auto;
      padding: 36px clamp(22px, 5vw, 64px) 56px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(26,32,44,.06);
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { color: var(--ink); scroll-margin-top: 82px; }
    .markdown-body h1 { margin: 0 0 28px; padding-bottom: 16px; border-bottom: 2px solid var(--brand); font-size: 28px; line-height: 1.35; }
    .markdown-body h2 { margin: 40px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line); font-size: 21px; }
    .markdown-body h3 { margin: 28px 0 12px; font-size: 17px; }
    .markdown-body h4 { margin: 22px 0 10px; font-size: 15px; }
    .markdown-body p, .markdown-body li { font-size: 14px; line-height: 1.85; }
    .markdown-body ul, .markdown-body ol { padding-left: 24px; }
    .markdown-body a { color: #B72832; text-underline-offset: 3px; }
    .markdown-body strong { color: #222831; }
    .markdown-body blockquote { margin: 16px 0; padding: 10px 16px; color: #596270; background: #F7F8FA; border-left: 3px solid #AEB6C2; }
    .markdown-body code { padding: 2px 5px; color: #922B35; background: #F8EDEF; border-radius: 4px; font-family: Consolas, "SFMono-Regular", monospace; }
    .markdown-body pre { overflow-x: auto; padding: 16px; color: #ECF0F4; background: #20262E; border-radius: 6px; }
    .markdown-body pre code { padding: 0; color: inherit; background: transparent; }
    .table-wrap { overflow-x: auto; margin: 16px 0 24px; border: 1px solid var(--line); border-radius: 6px; }
    .markdown-body table { width: 100%; min-width: 660px; border-collapse: collapse; }
    .markdown-body th, .markdown-body td { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.55; text-align: left; vertical-align: top; }
    .markdown-body th { color: #303742; background: #F3F5F7; font-weight: 700; }
    .markdown-body tr:last-child td { border-bottom: 0; }
    .loading, .error { padding: 80px 16px; color: var(--muted); text-align: center; }
    .error strong { display: block; margin-bottom: 8px; color: var(--brand-dark); }
    @media (max-width: 900px) {
      .doc-header { position: static; align-items: flex-start; flex-direction: column; padding: 12px 16px; }
      .actions { width: 100%; overflow-x: auto; }
      .action { min-height: 36px; }
      .mobile-picker { display: block; }
      .layout { display: block; min-height: 0; }
      .sidebar { display: none; }
      .content-wrap { padding: 16px 12px 36px; }
      .markdown-body { padding: 26px 18px 40px; border-radius: 6px; }
      .markdown-body h1 { font-size: 23px; }
      .markdown-body h2 { font-size: 19px; }
    }
    @media print {
      .doc-header, .mobile-picker, .sidebar, .source-note { display: none !important; }
      .layout { display: block; }
      .content-wrap { padding: 0; }
      .markdown-body { max-width: none; padding: 0; border: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="doc-header">
    <div class="doc-title">
      <strong id="current-title">客服 Agent 看板增量 PRD V1.0</strong>
      <span>知识库 Markdown 为事实源，本页为发布副本 · <span class="status">PRD 初版，待技术评审</span></span>
    </div>
    <div class="actions">
      <a class="action" id="download-current" href="#" download>↓ 当前 Markdown</a>
      <a class="action primary" href="../downloads/客服Agent看板-PRD完整包-V1.0-20260929.zip" download>↓ 完整 PRD 包</a>
      <button class="action" id="print" type="button">打印 / PDF</button>
    </div>
  </header>

  <div class="mobile-picker">
    <select class="mobile-doc-select" id="mobile-doc-select" aria-label="选择 PRD 文档"></select>
  </div>

  <div class="layout">
    <aside class="sidebar" aria-label="PRD 文档导航">
      <div class="sidebar-title">PRD 与开发分册</div>
      <nav class="doc-list" id="doc-list"></nav>
      <div class="divider"></div>
      <div class="sidebar-title">当前文档目录</div>
      <nav class="toc-list" id="toc"></nav>
    </aside>
    <main class="content-wrap">
      <div class="source-note"><span aria-hidden="true">●</span><span>完整包包含 1 份增量 PRD、8 份开发分册和文件清单。原型与文档均为评审材料，不代表生产能力。</span></div>
      <article class="markdown-body" id="content"><div class="loading">正在加载 PRD...</div></article>
    </main>
  </div>

  <script>
    const documents = [
      { label: "增量 PRD V1.0", path: "客服Agent看板_统计口径与交互优化_增量PRD_V1.0.md" },
      { label: "跨平台总览分册", path: "业务线开发分册/跨平台总览_开发分册.md" },
      { label: "大健康分册", path: "业务线开发分册/大健康_开发分册.md" },
      { label: "拼多多分册", path: "业务线开发分册/拼多多_开发分册.md" },
      { label: "抖音分册", path: "业务线开发分册/抖音_开发分册.md" },
      { label: "天猫国际分册", path: "业务线开发分册/天猫国际_开发分册.md" },
      { label: "淘宝分册", path: "业务线开发分册/淘宝_开发分册.md" },
      { label: "淘工厂分册", path: "业务线开发分册/淘工厂_开发分册.md" },
      { label: "小红书分册", path: "业务线开发分册/小红书_开发分册.md" }
    ];
    const byPath = new Map(documents.map((doc) => [doc.path, doc]));
    const content = document.getElementById("content");
    const toc = document.getElementById("toc");
    const docList = document.getElementById("doc-list");
    const mobileSelect = document.getElementById("mobile-doc-select");
    const currentTitle = document.getElementById("current-title");
    const currentDownload = document.getElementById("download-current");
    let currentDocument = documents[0];

    function renderNavigation() {
      docList.innerHTML = documents.map((doc) => `<button type="button" class="doc-link" data-path="${doc.path}" title="${doc.label}">${doc.label}</button>`).join("");
      mobileSelect.innerHTML = documents.map((doc) => `<option value="${doc.path}">${doc.label}</option>`).join("");
      docList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-path]");
        if (button) loadDocument(button.dataset.path);
      });
      mobileSelect.addEventListener("change", () => loadDocument(mobileSelect.value));
    }

    function setActiveNavigation(path) {
      document.querySelectorAll("[data-path]").forEach((item) => item.classList.toggle("active", item.dataset.path === path));
      mobileSelect.value = path;
    }

    function buildToc() {
      const headings = [...content.querySelectorAll("h2, h3")];
      headings.forEach((heading, index) => { heading.id = "section-" + (index + 1); });
      toc.innerHTML = headings.map((heading) => `<a class="toc-link level-${heading.tagName.slice(1)}" href="#${heading.id}" title="${heading.textContent}">${heading.textContent}</a>`).join("");
    }

    function rewriteDocumentLinks() {
      const pageRoot = new URL("./", window.location.href);
      const currentFile = new URL(currentDocument.path, pageRoot);
      content.querySelectorAll("a[href]").forEach((link) => {
        const sourceHref = link.getAttribute("href");
        if (!sourceHref || sourceHref.startsWith("#")) return;
        if (sourceHref.includes("dashboard-demo/index.html")) {
          link.href = "../#prototype";
          link.target = "_top";
          return;
        }
        if (!sourceHref.toLowerCase().endsWith(".md")) return;
        const resolved = new URL(sourceHref, currentFile);
        if (!resolved.pathname.startsWith(pageRoot.pathname)) return;
        const relative = decodeURIComponent(resolved.pathname.slice(pageRoot.pathname.length));
        if (!byPath.has(relative)) return;
        link.href = "?doc=" + encodeURIComponent(relative);
        link.addEventListener("click", (event) => {
          event.preventDefault();
          loadDocument(relative);
        });
      });
    }

    async function loadDocument(path) {
      const doc = byPath.get(path) || documents[0];
      currentDocument = doc;
      setActiveNavigation(doc.path);
      currentTitle.textContent = doc.label;
      currentDownload.href = doc.path;
      currentDownload.download = doc.path.split("/").pop();
      content.innerHTML = '<div class="loading">正在加载 PRD...</div>';
      toc.innerHTML = "";
      try {
        if (!window.marked) throw new Error("Markdown 渲染组件加载失败");
        const response = await fetch(doc.path, { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        marked.setOptions({ gfm: true });
        content.innerHTML = marked.parse(await response.text());
        content.querySelectorAll("table").forEach((table) => {
          const wrapper = document.createElement("div");
          wrapper.className = "table-wrap";
          table.parentNode.insertBefore(wrapper, table);
          wrapper.appendChild(table);
        });
        rewriteDocumentLinks();
        buildToc();
        history.replaceState(null, "", "?doc=" + encodeURIComponent(doc.path));
        document.querySelector(".content-wrap").scrollIntoView({ block: "start" });
      } catch (error) {
        content.innerHTML = `<div class="error"><strong>PRD 加载失败</strong><span>${error.message}</span><br><br><a href="${doc.path}" download>直接下载当前 Markdown</a></div>`;
      }
    }

    renderNavigation();
    document.getElementById("print").addEventListener("click", () => window.print());
    const requested = new URLSearchParams(window.location.search).get("doc");
    loadDocument(byPath.has(requested) ? requested : documents[0].path);
  </script>
</body>
</html>
