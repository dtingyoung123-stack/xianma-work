  <script>
    (() => {
      const MD_FILE = "%E5%85%88%E9%A9%AC%C2%B7AI%20Studio-V2.1.0-%E9%9C%80%E6%B1%82%E5%88%86%E6%9E%90Skill%E4%BA%A7%E5%93%81%E6%8E%A5%E5%85%A5%E5%A5%91%E7%BA%A6.md";

      marked.use({
        extensions: [{
          name: "mermaid",
          level: "block",
          start(src) { return src.indexOf("```mermaid"); },
          tokenizer(src) {
            const rule = /^```mermaid[ \t]*\n([\s\S]*?)\n?```/;
            const match = rule.exec(src);
            return match ? { type: "mermaid", raw: match[0], text: match[1] } : undefined;
          },
          renderer(token) {
            return `<div class="diagram-wrap"><div class="mermaid">${token.text}</div></div>`;
          }
        }]
      });

      mermaid.initialize({
        startOnLoad: false,
        theme: "base",
        themeVariables: {
          primaryColor: "#FFF1F2",
          primaryBorderColor: "#D9353F",
          primaryTextColor: "#303742",
          secondaryColor: "#F6F7F8",
          tertiaryColor: "#FFF8F8",
          lineColor: "#B72832",
          edgeLabelBackground: "#FFF8F8",
          fontFamily: '"Microsoft YaHei","PingFang SC",Arial,sans-serif',
          fontSize: "14px"
        },
        flowchart: { curve: "basis", nodeSpacing: 42, rankSpacing: 46, padding: 10 },
        sequence: { actorMargin: 56, boxMargin: 8, messageMargin: 34, noteMargin: 10, mirrorActors: false },
        suppressErrorRendering: true
      });

      const content = document.getElementById("doc-content");
      const backTop = document.getElementById("back-top");
      let loaded = false;

      function buildToc() {
        const headings = [...document.querySelectorAll("#doc-content h2, #doc-content h3")];
        const used = new Set();
        headings.forEach((heading, index) => {
          let id = heading.textContent.trim().toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g, "-").replace(/^-|-$/g, "") || "section-" + index;
          while (used.has(id)) id += "-" + index;
          used.add(id); heading.id = id;
        });
        const fill = (target) => {
          target.innerHTML = "";
          headings.forEach((heading) => {
            const item = document.createElement("li");
            item.className = "level-" + heading.tagName.slice(1);
            item.innerHTML = `<a href="#${heading.id}" data-target="${heading.id}">${heading.textContent}</a>`;
            target.appendChild(item);
          });
        };
        fill(document.getElementById("toc"));
        fill(document.getElementById("mobile-toc-list"));
      }

      async function loadDoc() {
        if (loaded) return;
        loaded = true;
        try {
          const response = await fetch(MD_FILE);
          if (!response.ok) throw new Error("HTTP " + response.status);
          marked.setOptions({ gfm: true });
          content.innerHTML = marked.parse(await response.text());
          content.querySelectorAll("table").forEach((table) => {
            const wrapper = document.createElement("div");
            wrapper.className = "table-wrap";
            table.before(wrapper);
            wrapper.appendChild(table);
          });
          try {
            await mermaid.run({ querySelector: ".mermaid" });
          } catch (e) {
            console.warn("mermaid render issue:", e);
            document.querySelectorAll(".diagram-wrap .mermaid").forEach((el) => {
              if (!el.querySelector("svg")) el.classList.add("error-state");
            });
          }
          buildToc();
        } catch (error) {
          content.innerHTML = `<div class="load-error">文档加载失败：${error.message}<br>请通过 HTTP 服务访问此页面。</div>`;
        }
      }

      document.getElementById("print-btn").addEventListener("click", () => window.print());
      window.addEventListener("scroll", () => backTop.classList.toggle("show", scrollY > 700), { passive: true });
      loadDoc();
    })();
  </script>
