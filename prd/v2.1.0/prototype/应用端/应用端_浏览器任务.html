<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>先马·AI Studio - 受控浏览器</title>
<style>
  :root{
    --brand:#D9353F;--brand-soft:#FCEBED;--text:#1C2128;--muted:#667085;
    --faint:#98A2B3;--border:#E4E7EC;--page:#EEF2F7;--surface:#fff;
    --subtle:#F7F8FA;--success:#178553;--success-soft:#EAF7F0;
    --warning:#B54708;--warning-soft:#FFF4E5;--danger:#C4323A;
  }
  *{box-sizing:border-box;letter-spacing:0;}
  body{margin:0;min-width:1024px;min-height:700px;background:var(--page);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);}
  button,input,textarea,select{font:inherit;}
  button{cursor:pointer;}
  .browser-window{width:calc(100vw - 28px);height:calc(100vh - 28px);min-height:672px;margin:14px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #D8DEE8;border-radius:10px;background:var(--surface);box-shadow:0 20px 50px rgba(16,24,40,.16);}
  .window-bar{height:36px;flex:0 0 36px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--border);background:#FAFBFC;}
  .dot{width:11px;height:11px;border-radius:50%;}.dot.red{background:#FF5F57}.dot.yellow{background:#FEBC2E}.dot.green{background:#28C840}
  .window-title{margin-left:8px;font-size:12px;color:var(--muted);}
  .browser-bar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:#fff;}
  .tool-btn{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:17px;}
  .tool-btn:hover{background:var(--subtle);color:var(--text);}
  .tool-btn:disabled{cursor:not-allowed;color:#C8CDD5;}
  .address{min-width:0;flex:1;height:36px;display:flex;align-items:center;gap:9px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:var(--subtle);}
  .address .lock{color:var(--success);font-size:13px;}.address input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:13px;}
  .browser-brand{display:flex;align-items:center;gap:8px;padding-left:5px;color:var(--muted);font-size:12px;white-space:nowrap;}.browser-brand img{width:24px;height:24px;object-fit:contain;}
  .workspace{min-height:0;flex:1;display:block;}
  .webview{min-width:0;flex:1;position:relative;overflow:hidden;background:#F4F6F9;}
  .webview{width:100%;height:100%;}

  .login-screen{position:absolute;inset:0;display:grid;place-items:center;padding:40px;background:linear-gradient(180deg,#F4F7FB 0,#EEF2F7 100%);}.login-card{width:390px;padding:30px;border:1px solid var(--border);border-radius:8px;background:#fff;box-shadow:0 14px 34px rgba(16,24,40,.09)}.login-logo{width:42px;height:42px;display:grid;place-items:center;margin-bottom:18px;border-radius:8px;background:#26364E;color:#fff;font-weight:700}.login-card h1{margin:0 0 6px;font-size:22px}.login-card>p{margin:0 0 22px;color:var(--muted);font-size:13px}.field{margin-bottom:15px}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px}.field input,.field select,.field textarea{width:100%;height:40px;padding:0 11px;border:1px solid var(--border);border-radius:6px;outline:none;color:var(--text);background:#fff;font-size:13px}.field textarea{height:78px;padding-top:10px;resize:none;line-height:1.5}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}.login-submit{width:100%;height:40px;margin-top:4px;border:0;border-radius:6px;background:#26364E;color:#fff;font-size:13px;font-weight:600}.privacy-note{margin-top:13px;color:var(--faint);font-size:11px;text-align:center}
  .service-app{position:absolute;inset:0;display:none;grid-template-columns:184px minmax(0,1fr);background:#F3F5F8}.service-app.show{display:grid}.service-nav{padding:20px 14px;background:#26364E;color:#D8E0EA}.service-logo{display:flex;align-items:center;gap:9px;padding:0 8px 20px;font-weight:700}.service-logo span:first-child{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;background:var(--brand);color:#fff}.service-nav a{display:block;margin-bottom:4px;padding:10px 11px;border-radius:5px;color:#BFCADA;font-size:12.5px;text-decoration:none}.service-nav a.active{background:rgba(255,255,255,.12);color:#fff}.service-main{min-width:0;overflow:auto}.service-top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--border);background:#fff}.service-top strong{font-size:15px}.demo-user{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:12px}.service-content{padding:20px}.content-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.content-head h2{margin:0;font-size:18px}.add-btn{height:34px;padding:0 13px;border:0;border-radius:5px;background:#26364E;color:#fff;font-size:12px}.data-box{border:1px solid var(--border);background:#fff}.data-row{display:grid;grid-template-columns:1.2fr .8fr .8fr .7fr;gap:12px;align-items:center;min-height:48px;padding:0 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}.data-row.head{min-height:40px;background:#F8F9FB;color:var(--faint);font-size:11px}.data-row:last-child{border-bottom:0}.status-text{color:var(--success)}
  .form-drawer{position:absolute;top:0;right:0;bottom:0;width:420px;display:none;flex-direction:column;border-left:1px solid var(--border);background:#fff;box-shadow:-12px 0 30px rgba(16,24,40,.1)}.form-drawer.show{display:flex}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}.drawer-head h3{margin:0;font-size:16px}.drawer-body{flex:1;overflow:auto;padding:18px 20px}.form-actions{display:flex;justify-content:flex-end;gap:8px;padding:13px 20px;border-top:1px solid var(--border)}.form-actions .btn{height:36px;padding:0 14px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);font-size:12.5px}.form-actions .btn.primary{border-color:var(--brand);background:var(--brand);color:#fff}.fake-file{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:12px}.ai-focus{border-color:var(--brand)!important;box-shadow:0 0 0 3px var(--brand-soft)!important}
  .toast{position:absolute;z-index:30;top:16px;left:50%;padding:9px 14px;border-radius:6px;background:rgba(28,33,40,.92);color:#fff;font-size:12px;opacity:0;transform:translate(-50%,-8px);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:1120px){.service-app{grid-template-columns:150px minmax(0,1fr)}.service-nav{padding-left:10px;padding-right:10px}.data-row{grid-template-columns:1.2fr .8fr .7fr}.data-row span:nth-child(3),.data-row.head span:nth-child(3){display:none}.form-drawer{width:380px}}
</style>
<script src="../assets/v210-icon.js"></script></head>
<body>
<div class="browser-window">
  <div class="window-bar">
    <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
    <span class="window-title">受控浏览器</span>
  </div>
  <div class="browser-bar">
    <button class="tool-btn" title="后退" aria-label="后退"><xianma-icon name="arrow-left"></xianma-icon></button>
    <button class="tool-btn" title="前进" aria-label="前进" disabled><xianma-icon name="arrow-right"></xianma-icon></button>
    <button class="tool-btn" title="刷新" aria-label="刷新" onclick="showToast('页面已刷新')"><xianma-icon name="rotate-cw"></xianma-icon></button>
    <div class="address"><span class="lock"><xianma-icon name="lock"></xianma-icon></span><input id="address-input" aria-label="网址" readonly><button class="tool-btn" title="复制网址" aria-label="复制网址" onclick="copyUrl()"><xianma-icon name="copy"></xianma-icon></button></div>
    <div class="browser-brand"><img src="../icon.png" alt=""><span>先马·AI Studio</span></div>
  </div>
  <div class="workspace">
    <main class="webview">
      <div class="toast" id="toast"></div>
      <div class="login-screen" id="login-screen">
        <form class="login-card" onsubmit="event.preventDefault();completeLogin()">
          <div class="login-logo">服</div>
          <h1>服务工作台</h1>
          <p>使用你的工作账号登录</p>
          <div class="field"><label for="account">账号</label><input id="account" autocomplete="off" placeholder="请输入账号" value="demo.user"></div>
          <div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="off" placeholder="请输入密码"></div>
          <button class="login-submit" type="submit">登录</button>
          <div class="privacy-note">登录信息仅由当前网站处理，AI 不读取账号密码</div>
        </form>
      </div>
      <section class="service-app" id="service-app">
        <nav class="service-nav">
          <div class="service-logo"><span>服</span><span>服务工作台</span></div>
          <a href="#">工作概览</a><a href="#">会话管理</a><a class="active" href="#">服务记录</a><a href="#">客户标签</a><a href="#">数据报表</a>
        </nav>
        <div class="service-main">
          <header class="service-top"><strong>服务记录</strong><span class="demo-user">员</span></header>
          <div class="service-content">
            <div class="content-head"><h2>记录列表</h2><button class="add-btn" onclick="openForm()">新增记录</button></div>
            <div class="data-box" id="record-list">
              <div class="data-row head"><span>记录主题</span><span>类型</span><span>创建时间</span><span>状态</span></div>
              <div class="data-row"><span>商品信息咨询</span><span>咨询</span><span>今天 10:24</span><span class="status-text">已完成</span></div>
              <div class="data-row"><span>物流进度确认</span><span>跟进</span><span>昨天 16:40</span><span class="status-text">已完成</span></div>
              <div class="data-row"><span>售后凭证待补</span><span>售后</span><span>昨天 11:08</span><span>待处理</span></div>
            </div>
          </div>
        </div>
        <div class="form-drawer" id="form-drawer">
          <div class="drawer-head"><h3>新增服务记录</h3><button class="tool-btn" aria-label="关闭" onclick="closeForm()"><xianma-icon name="x"></xianma-icon></button></div>
          <div class="drawer-body">
            <div class="field"><label>记录主题</label><input id="record-title" value="售后资料补充"></div>
            <div class="field"><label>服务类型</label><select id="record-type"><option>售后跟进</option><option>商品咨询</option><option>物流咨询</option></select></div>
            <div class="field"><label>处理说明</label><textarea id="record-note">已收到补充资料，等待后续处理。</textarea></div>
            <div class="field"><label>附件</label><div class="fake-file"><span id="file-name">售后说明.docx</span><span>已选择</span></div></div>
          </div>
          <div class="form-actions"><button class="btn" onclick="closeForm()">取消</button><button class="btn primary" onclick="requestRiskConfirm()">提交</button></div>
        </div>
      </section>
    </main>
  </div>
</div>
<script>
  const params=new URL(location.href).searchParams;
  const targetUrl=params.get('url')||'https://service.example.com/records';
  const taskMessage=params.get('message')||'打开服务工作台，新增一条服务记录并下载执行结果。';
  const taskId=params.get('taskId')||'default';
  const stateKey=`xianmaBrowserTaskState:${taskId}`;
  let state='login';
  let paused=false;
  let timer=null;
  let resumeState='running';
  const activityLog=[];
  document.getElementById('address-input').value=targetUrl;

  function publishState(next,extra={}){
    state=next;
    let current={};try{current=JSON.parse(localStorage.getItem(stateKey)||'{}');}catch(e){}
    const payload={...current,state:next,url:targetUrl,message:taskMessage,events:activityLog.map(item=>item.text),updatedAt:Date.now(),...extra};
    localStorage.setItem(stateKey,JSON.stringify(payload));
  }
  function addActivity(text,tone='current'){
    activityLog.forEach(item=>{if(item.tone==='current')item.tone='success';});
    activityLog.push({text,tone});
    if(activityLog.length>6)activityLog.shift();
  }
  function completeLogin(){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('service-app').classList.add('show');
    addActivity('已完成登录，正在读取当前页面');
    publishState('running');
    timer=setTimeout(showRetry,700);
  }
  function showRetry(){
    if(paused)return;
    addActivity('页面响应超时，正在自动重试 1/2','warning');publishState('retry',{retry:1});
    timer=setTimeout(continueAfterRetry,1100);
  }
  function continueAfterRetry(){
    if(paused)return;
    addActivity('页面已恢复，正在填写可见表单');
    document.getElementById('form-drawer').classList.add('show');
    document.getElementById('record-title').classList.add('ai-focus');
    publishState('running');
    timer=setTimeout(()=>{
      document.getElementById('record-title').classList.remove('ai-focus');
      addActivity('表单已填写，等待确认外部数据变更','warning');requestRiskConfirm();
    },1000);
  }
  function openForm(){document.getElementById('form-drawer').classList.add('show');}
  function requestRiskConfirm(){
    if(paused)return;
    clearTimeout(timer);publishState('confirm',{confirmation:{title:'确认新增服务记录',description:'这项操作会向外部系统写入数据并上传文件。',action:'新增 1 条服务记录',content:'售后资料补充 · 售后跟进',file:'售后说明.docx'}});
  }
  function confirmAction(){
    addActivity('已提交新增请求，网站响应较慢，正在核验是否已生效','warning');
    publishState('verifying',{confirmed:true,externalEffects:true,completedActions:['已向服务工作台提交新增服务记录'],pendingActions:['下载网站生成的结果文件']});
    timer=setTimeout(verifyWriteResult,850);
  }
  function verifyWriteResult(){
    addActivity('已在记录列表中找到目标记录，确认新增成功');
    publishState('running');
    timer=setTimeout(completeTask,550);
  }
  function completeTask(){
    const recordList=document.getElementById('record-list');
    if(!recordList.querySelector('[data-new-record]')){
      const row=document.createElement('div');row.className='data-row';row.setAttribute('data-new-record','true');
      row.innerHTML='<span>售后资料补充</span><span>售后</span><span>刚刚</span><span class="status-text">已完成</span>';
      recordList.appendChild(row);
    }
    addActivity('网页操作已完成，操作结果已保存','success');
    document.getElementById('form-drawer').classList.remove('show');showToast('服务记录已新增');publishState('complete',{confirmed:true,completedAt:Date.now(),download:{name:'服务记录导出.csv',type:'CSV',status:'已下载',location:'授权工作区/下载'},resultTitle:'网页操作已完成',resultBody:'服务记录已新增，网站生成的结果文件已下载到授权工作区。'});
  }
  function stopTaskFromConversation(nextState='cancelled'){
    clearTimeout(timer);
    addActivity(nextState==='superseded'?'目标已改变，旧任务已停止':nextState==='partial'?'任务已停止，已完成操作不会自动回退':'任务已取消，未继续执行后续操作','warning');
    state=nextState;paused=true;document.getElementById('form-drawer').classList.remove('show');
  }
  function closeForm(){document.getElementById('form-drawer').classList.remove('show');}
  function applyConversationControl(){
    let task={};try{task=JSON.parse(localStorage.getItem(stateKey)||'{}');}catch(e){}
    if(task.state==='approved'&&state==='confirm'){confirmAction();return;}
    if(['cancelled','partial','superseded','failed','uncertain','blocked'].includes(task.state)&&!['cancelled','partial','superseded','failed','uncertain','blocked','complete'].includes(state)){stopTaskFromConversation(task.state);return;}
    if((task.state==='paused'||task.state==='takeover')&&!paused){resumeState=state;paused=true;clearTimeout(timer);return;}
    if(!['paused','takeover','cancelled','partial','superseded','failed','uncertain','blocked'].includes(task.state)&&paused){
      paused=false;
      if(task.state==='running'){addActivity('已交还 AI，正在重新读取页面');publishState('running');timer=setTimeout(continueAfterRetry,500);}
    }
  }
  function copyUrl(){
    const input=document.getElementById('address-input');
    if(navigator.clipboard)navigator.clipboard.writeText(input.value).then(()=>showToast('网址已复制')).catch(()=>showToast('请手动复制网址'));else showToast('请手动复制网址');
  }
  function showToast(message){
    const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);
  }
  window.addEventListener('storage',event=>{if(event.key===stateKey)applyConversationControl();});
  window.setInterval(applyConversationControl,500);
  addActivity('浏览器已打开，等待员工手动登录','current');publishState('login');
</script>
</body>
</html>
