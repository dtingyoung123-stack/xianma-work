<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>先马·AI Studio 定时任务原型</title>
<link rel="stylesheet" href="../assets/ui-tokens.css">
<style>
  .schedule-main{min-width:0;overflow:auto;padding:34px 42px 40px;}
  .schedule-shell{width:min(920px,100%);margin:0 auto;}
  .schedule-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px;}
  .schedule-head h1{margin:0 0 6px;font-size:28px;color:var(--text-strong);}
  .schedule-head p{margin:0;color:var(--text-muted);font-size:14px;line-height:1.6;}
  .schedule-head .btn{flex:none;}
  .runtime-note{display:flex;align-items:flex-start;gap:9px;margin-bottom:18px;padding:11px 13px;border-left:3px solid var(--warning);border-radius:0 var(--radius) var(--radius) 0;background:var(--warning-soft);color:#7a4b08;font-size:12px;line-height:1.55;}
  .runtime-note xianma-icon{--icon-size:16px;flex:0 0 16px;margin-top:1px;}
  .schedule-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px;}
  .schedule-filters{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .filter-btn{min-height:32px;padding:0 11px;border:1px solid transparent;border-radius:var(--radius);background:transparent;color:var(--text-muted);font-size:13px;}
  .filter-btn:hover{background:var(--surface-subtle);color:var(--text-strong);}
  .filter-btn.active{border-color:var(--brand-border);background:var(--brand-soft);color:var(--brand);font-weight:700;}
  .schedule-count{color:var(--text-faint);font-size:12px;white-space:nowrap;}
  .schedule-list{display:flex;flex-direction:column;gap:10px;}
  .schedule-card{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;min-height:94px;padding:15px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
  .schedule-card:hover{border-color:var(--border-strong);}
  .task-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:var(--radius);background:var(--brand-soft);font-size:20px;}
  .task-copy{min-width:0;}
  .task-title-row{display:flex;align-items:center;gap:8px;min-width:0;margin-bottom:4px;}
  .task-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-strong);font-size:15px;font-weight:700;}
  .task-desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted);font-size:12px;line-height:1.55;}
  .task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--text-faint);font-size:11px;}
  .schedule-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:4px;background:var(--surface-subtle);color:var(--text-muted);}
  .schedule-chip xianma-icon{--icon-size:13px;}
  .status-pill{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
  .status-pill.active{background:var(--success-soft);color:var(--success);}
  .status-pill.paused,.status-pill.completed{background:var(--surface-subtle);color:var(--text-faint);}
  .status-pill.missed{background:var(--warning-soft);color:#8a5600;}
  .task-actions{display:flex;align-items:center;justify-content:flex-end;gap:4px;flex-wrap:wrap;max-width:300px;}
  .task-actions .btn{height:32px;padding:0 9px;font-size:12px;}
  .switch{position:relative;width:40px;height:22px;flex:0 0 40px;margin-left:4px;}
  .switch input{position:absolute;opacity:0;pointer-events:none;}
  .switch-track{position:absolute;inset:0;border-radius:999px;background:#cfd3d8;cursor:pointer;transition:.18s;}
  .switch-track::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.18s;}
  .switch input:checked + .switch-track{background:var(--success);}
  .switch input:checked + .switch-track::after{transform:translateX(18px);}
  .switch input:focus-visible + .switch-track{outline:2px solid var(--brand);outline-offset:2px;}
  .empty-state{min-height:260px;display:grid;place-items:center;padding:36px;border:1px dashed var(--border-strong);border-radius:var(--radius);background:var(--surface);text-align:center;}
  .empty-state xianma-icon{--icon-size:28px;color:var(--brand);}
  .empty-state h2{margin:12px 0 6px;font-size:16px;}
  .empty-state p{margin:0;color:var(--text-muted);font-size:13px;}
  .empty-state .btn{margin-top:16px;}
  .schedule-modal{display:flex;flex-direction:column;overflow:hidden;}
  .schedule-modal .modal-body{min-height:0;overflow:auto;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
  .form-grid .field.full{grid-column:1/-1;}
  .field label{font-size:13px;}
  .frequency-control{display:flex;gap:6px;flex-wrap:wrap;}
  .frequency-control button{height:34px;padding:0 13px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text-muted);font-size:13px;}
  .frequency-control button.active{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:700;}
  .form-preview{display:flex;align-items:flex-start;gap:8px;margin-top:2px;padding:11px 12px;border-radius:var(--radius);background:var(--surface-subtle);color:var(--text-muted);font-size:12px;line-height:1.55;}
  .form-preview xianma-icon{--icon-size:15px;flex:none;margin-top:1px;color:var(--brand);}
  .delete-action{margin-right:auto;}
  .record-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;}
  .record-summary div{padding:12px;border-radius:var(--radius);background:var(--surface-subtle);}
  .record-summary span,.record-summary strong{display:block;}
  .record-summary span{margin-bottom:4px;color:var(--text-faint);font-size:11px;}
  .record-summary strong{font-size:13px;}
  .run-list{margin:0;padding:0;list-style:none;}
  .run-item{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;padding:13px 0;border-bottom:1px solid var(--border);}
  .run-item:last-child{border-bottom:0;}
  .run-icon{color:var(--success);}
  .run-icon.warning{color:var(--warning);}
  .run-icon.danger{color:var(--danger);}
  .run-icon xianma-icon{--icon-size:16px;}
  .run-copy strong,.run-copy span{display:block;}
  .run-copy strong{font-size:13px;}
  .run-copy span{margin-top:4px;color:var(--text-muted);font-size:12px;line-height:1.5;}
  .run-time{color:var(--text-faint);font-size:11px;white-space:nowrap;}
  .confirm-copy{margin:0;color:var(--text-muted);font-size:13px;line-height:1.65;}
  @media(max-width:1120px){.schedule-main{padding:28px 28px 36px;}.schedule-card{grid-template-columns:42px minmax(0,1fr);}.task-actions{grid-column:2;justify-content:flex-start;max-width:none;}}
  @media(max-width:760px){.schedule-head{align-items:stretch;flex-direction:column;}.schedule-head .btn{align-self:flex-start;}.form-grid{grid-template-columns:1fr;}.form-grid .field.full{grid-column:auto;}.record-summary{grid-template-columns:1fr;}}
</style>
<script src="../assets/v210-icon.js"></script><script src="../assets/v210-app-sidebar.js?v=20260915-scheduled"></script>
</head>
<body class="v210-app-page">
<div class="app-window">
  <div class="titlebar"><span class="window-dot red"></span><span class="window-dot yellow"></span><span class="window-dot green"></span></div>
  <div class="app-body"><xianma-app-sidebar></xianma-app-sidebar><main class="schedule-main"><div class="schedule-shell">
    <header class="schedule-head"><div><h1>定时任务</h1><p>按计划执行重复工作，并集中查看每次运行结果</p></div><button class="btn primary" type="button" onclick="openTaskModal()"><xianma-icon name="plus"></xianma-icon>新增定时任务</button></header>
    <div class="runtime-note"><xianma-icon name="triangle-alert"></xianma-icon><span>任务仅在客户端在线或后台常驻时执行。关闭期间到期的任务会标记为“已错过”，重新打开后可人工补跑。</span></div>
    <div class="schedule-toolbar"><div class="schedule-filters" role="tablist" aria-label="定时任务状态"><button class="filter-btn active" type="button" data-filter="all" onclick="setFilter(this)">全部</button><button class="filter-btn" type="button" data-filter="active" onclick="setFilter(this)">运行中</button><button class="filter-btn" type="button" data-filter="paused" onclick="setFilter(this)">已暂停</button><button class="filter-btn" type="button" data-filter="missed" onclick="setFilter(this)">已错过</button></div><span class="schedule-count" id="schedule-count"></span></div>
    <section class="schedule-list" id="schedule-list" aria-live="polite"></section>
  </div></main></div>
</div>
<div class="toast-host" id="toast-host"></div>

<div class="modal-layer" id="task-modal" onclick="if(event.target===this)closeTaskModal()"><section class="modal wide schedule-modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
  <header class="modal-head"><div class="modal-head-copy"><h2 id="task-modal-title">新增定时任务</h2><p>设置任务内容、执行时间与工作区</p></div><button class="icon-btn" type="button" aria-label="关闭" onclick="closeTaskModal()"><xianma-icon name="x"></xianma-icon></button></header>
  <div class="modal-body"><div class="form-grid">
    <div class="field full"><label for="task-name">任务名称</label><input class="input" id="task-name" maxlength="40" placeholder="例如：生成上周周报"></div>
    <div class="field full"><label for="task-instruction">任务指令</label><textarea class="textarea" id="task-instruction" placeholder="说明每次需要完成的工作和期望结果"></textarea><div class="field-error" id="instruction-error">请填写明确的任务指令</div></div>
    <div class="field full"><label>执行周期</label><div class="frequency-control" id="frequency-control"><button type="button" data-frequency="once" onclick="selectFrequency(this)">单次</button><button class="active" type="button" data-frequency="daily" onclick="selectFrequency(this)">每天</button><button type="button" data-frequency="weekly" onclick="selectFrequency(this)">每周</button></div></div>
    <div class="field" id="date-field"><label for="task-date">执行日期</label><input class="input" id="task-date" type="date" value="2026-09-16"></div>
    <div class="field" id="weekday-field"><label for="task-weekday">星期</label><select class="select" id="task-weekday"><option value="一">周一</option><option value="二">周二</option><option value="三">周三</option><option value="四">周四</option><option value="五">周五</option><option value="六">周六</option><option value="日">周日</option></select></div>
    <div class="field"><label for="task-time">执行时间</label><input class="input" id="task-time" type="time" value="09:00"></div>
    <div class="field"><label for="task-workspace">工作区</label><select class="select" id="task-workspace"><option>运营工作</option><option>设计工作</option><option>默认工作区</option></select></div>
    <div class="field full"><div class="form-preview"><xianma-icon name="clock-3"></xianma-icon><span id="task-preview"></span></div></div>
  </div></div>
  <footer class="modal-foot"><button class="btn text-danger delete-action" id="delete-task-btn" type="button" onclick="requestDelete()">删除任务</button><button class="btn secondary" type="button" onclick="closeTaskModal()">取消</button><button class="btn primary" type="button" onclick="saveTask()">确认保存</button></footer>
</section></div>

<div class="drawer-layer" id="record-drawer" onclick="if(event.target===this)closeRecords()"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="record-title">
  <header class="drawer-head"><div><h2 id="record-title">运行记录</h2><p id="record-subtitle"></p></div><button class="icon-btn" type="button" aria-label="关闭" onclick="closeRecords()"><xianma-icon name="x"></xianma-icon></button></header>
  <div class="drawer-body"><div class="record-summary" id="record-summary"></div><h3 style="margin:0 0 6px;font-size:14px">最近运行</h3><ul class="run-list" id="run-list"></ul></div><footer class="drawer-foot"><button class="btn secondary" type="button" onclick="closeRecords()">关闭</button></footer>
</aside></div>

<div class="modal-layer" id="delete-modal" onclick="if(event.target===this)closeDelete()"><section class="modal" role="alertdialog" aria-modal="true" aria-labelledby="delete-title">
  <header class="modal-head"><h2 id="delete-title">删除定时任务</h2><button class="icon-btn" type="button" aria-label="关闭" onclick="closeDelete()"><xianma-icon name="x"></xianma-icon></button></header><div class="modal-body"><p class="confirm-copy">删除后不会影响已经产生的运行结果，但该任务不会再按计划执行。确定删除吗？</p></div><footer class="modal-foot"><button class="btn secondary" type="button" onclick="closeDelete()">取消</button><button class="btn danger" type="button" onclick="confirmDelete()">确认删除</button></footer>
</section></div>

<script>
const STORAGE_KEY='xianmaScheduledTasksV210',SEED_KEY='xianmaScheduledDefaultsSeededV210';
const DEFAULT_TASKS=[
  {id:'schedule-weekly-report',icon:'📅',name:'生成上周周报',instruction:'整理上周工作记录并按公司模板生成结构化周报',frequency:'weekly',weekday:'一',date:'',time:'09:00',workspace:'运营工作',enabled:true,status:'active',createdFrom:'conversation',runs:[{status:'success',time:'2026-09-14 09:02',summary:'周报已生成并保存到运营工作区'},{status:'success',time:'2026-09-07 09:01',summary:'周报已生成并保存到运营工作区'}]},
  {id:'schedule-daily-log',icon:'📝',name:'整理每日工作记录',instruction:'汇总当天工作记录并生成简要总结',frequency:'daily',weekday:'一',date:'',time:'18:00',workspace:'运营工作',enabled:true,status:'active',createdFrom:'page',runs:[{status:'failed',time:'2026-09-14 18:00',summary:'工作区文件被占用，可人工补跑'}]},
  {id:'schedule-missed-file',icon:'📊',name:'整理新品登记表',instruction:'检查新品登记表并输出异常项清单',frequency:'once',weekday:'一',date:'2026-09-14',time:'10:00',workspace:'运营工作',enabled:true,status:'missed',createdFrom:'page',runs:[{status:'missed',time:'2026-09-14 10:00',summary:'客户端未运行，本次任务已错过'}]},
  {id:'schedule-image-check',icon:'🖼️',name:'检查新品图片',instruction:'检查工作区新增图片的尺寸和文件格式',frequency:'daily',weekday:'一',date:'',time:'20:00',workspace:'设计工作',enabled:false,status:'paused',createdFrom:'page',runs:[]}
];
let tasks=loadTasks(),currentFilter='all',editingId='',pendingDeleteId='',selectedFrequency='daily';
function cloneDefaults(){return JSON.parse(JSON.stringify(DEFAULT_TASKS));}
function loadTasks(){try{const value=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'),stored=Array.isArray(value)?value:[];if(localStorage.getItem(SEED_KEY))return stored;const ids=new Set(stored.map(task=>task.id)),merged=[...stored,...cloneDefaults().filter(task=>!ids.has(task.id))];localStorage.setItem(SEED_KEY,'1');return merged;}catch(error){localStorage.setItem(SEED_KEY,'1');return cloneDefaults();}}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
function scheduleText(task){if(task.frequency==='once')return `单次 · ${task.date} ${task.time}`;if(task.frequency==='weekly')return `每周${task.weekday} · ${task.time}`;return `每天 · ${task.time}`;}
function nextText(task){if(task.status==='missed')return `计划时间：${task.date} ${task.time}`;if(task.status==='completed')return '单次任务已完成';if(!task.enabled)return '已暂停，不会自动运行';if(task.frequency==='once')return `下次运行：${task.date} ${task.time}`;if(task.frequency==='weekly')return `下次运行：周${task.weekday} ${task.time}`;return `下次运行：今天 ${task.time}`;}
function statusInfo(task){if(task.status==='missed')return {label:'已错过',className:'missed'};if(task.status==='completed')return {label:'已完成',className:'completed'};if(!task.enabled||task.status==='paused')return {label:'已暂停',className:'paused'};return {label:'运行中',className:'active'};}
function latestResult(task){const latest=(task.runs||[])[0];if(!latest)return '尚未运行';if(latest.status==='success')return `最近成功：${latest.time}`;if(latest.status==='failed')return `最近失败：${latest.time}`;return `最近记录：${latest.time}`;}
function matchesFilter(task){if(currentFilter==='all')return true;if(currentFilter==='active')return task.enabled&&task.status==='active';if(currentFilter==='paused')return !task.enabled||task.status==='paused';return task.status==='missed';}
function render(){const visible=tasks.filter(matchesFilter),list=document.getElementById('schedule-list');document.getElementById('schedule-count').textContent=`共 ${visible.length} 个任务`;if(!visible.length){list.innerHTML=`<div class="empty-state"><div><xianma-icon name="clock-3"></xianma-icon><h2>当前没有匹配的定时任务</h2><p>新建任务后会在这里显示下一次运行和执行记录</p><button class="btn primary" type="button" onclick="openTaskModal()"><xianma-icon name="plus"></xianma-icon>新增定时任务</button></div></div>`;return;}list.innerHTML=visible.map(task=>{const status=statusInfo(task);return `<article class="schedule-card"><div class="task-mark">${escapeHtml(task.icon||'📅')}</div><div class="task-copy"><div class="task-title-row"><span class="task-title">${escapeHtml(task.name)}</span><span class="status-pill ${status.className}">${status.label}</span></div><div class="task-desc">${escapeHtml(task.instruction)}</div><div class="task-meta"><span class="schedule-chip"><xianma-icon name="clock-3"></xianma-icon>${escapeHtml(scheduleText(task))}</span><span>${escapeHtml(nextText(task))}</span><span>${escapeHtml(latestResult(task))}</span></div></div><div class="task-actions"><button class="btn ghost" type="button" onclick="openRecords('${task.id}')">查看记录</button><button class="btn secondary" type="button" onclick="runTask('${task.id}')">${task.status==='missed'?'补跑':'立即运行'}</button><button class="btn ghost" type="button" onclick="openTaskModal('${task.id}')">编辑</button><label class="switch" title="${task.enabled?'暂停任务':'启用任务'}"><input type="checkbox" aria-label="${task.enabled?'暂停':'启用'}${escapeHtml(task.name)}" ${task.enabled?'checked':''} onchange="toggleTask('${task.id}',this.checked)"><span class="switch-track"></span></label></div></article>`;}).join('');}
function setFilter(button){currentFilter=button.dataset.filter;document.querySelectorAll('.filter-btn').forEach(item=>item.classList.toggle('active',item===button));render();}
function selectFrequency(button){selectedFrequency=button.dataset.frequency;document.querySelectorAll('#frequency-control button').forEach(item=>item.classList.toggle('active',item===button));syncFrequencyFields();updatePreview();}
function syncFrequencyFields(){document.getElementById('date-field').style.display=selectedFrequency==='once'?'':'none';document.getElementById('weekday-field').style.display=selectedFrequency==='weekly'?'':'none';}
function updatePreview(){const temp={frequency:selectedFrequency,date:document.getElementById('task-date').value,weekday:document.getElementById('task-weekday').value,time:document.getElementById('task-time').value||'09:00'};document.getElementById('task-preview').textContent=`${scheduleText(temp)}。创建后立即启用；立即运行或补跑不会改变这条计划。`;}
function openTaskModal(id=''){editingId=id;const task=tasks.find(item=>item.id===id);document.getElementById('task-modal-title').textContent=task?'编辑定时任务':'新增定时任务';document.getElementById('delete-task-btn').style.display=task?'':'none';document.getElementById('task-name').value=task?.name||'';document.getElementById('task-instruction').value=task?.instruction||'';selectedFrequency=task?.frequency||'daily';document.querySelectorAll('#frequency-control button').forEach(item=>item.classList.toggle('active',item.dataset.frequency===selectedFrequency));document.getElementById('task-date').value=task?.date||'2026-09-16';document.getElementById('task-weekday').value=task?.weekday||'一';document.getElementById('task-time').value=task?.time||'09:00';document.getElementById('task-workspace').value=task?.workspace||'运营工作';document.getElementById('instruction-error').classList.remove('show');syncFrequencyFields();updatePreview();document.getElementById('task-modal').classList.add('show');setTimeout(()=>document.getElementById('task-name').focus(),0);}
function closeTaskModal(){document.getElementById('task-modal').classList.remove('show');editingId='';}
function saveTask(){const name=document.getElementById('task-name').value.trim(),instruction=document.getElementById('task-instruction').value.trim();if(!instruction){document.getElementById('instruction-error').classList.add('show');document.getElementById('task-instruction').focus();return;}const base={name:name||instruction.slice(0,18),instruction,frequency:selectedFrequency,date:selectedFrequency==='once'?document.getElementById('task-date').value:'',weekday:selectedFrequency==='weekly'?document.getElementById('task-weekday').value:'一',time:document.getElementById('task-time').value||'09:00',workspace:document.getElementById('task-workspace').value,enabled:true,status:'active'};if(editingId){const task=tasks.find(item=>item.id===editingId);Object.assign(task,base);toast(`已保存：${task.name}`);}else{tasks.unshift({id:`schedule-${Date.now().toString(36)}`,icon:instruction.includes('图片')?'🖼️':instruction.includes('周报')?'📅':'📝',createdFrom:'page',runs:[],...base});toast('定时任务已创建');}persist();closeTaskModal();currentFilter='all';document.querySelectorAll('.filter-btn').forEach(item=>item.classList.toggle('active',item.dataset.filter==='all'));render();}
function toggleTask(id,enabled){const task=tasks.find(item=>item.id===id);if(!task)return;task.enabled=enabled;if(task.status!=='missed'&&task.status!=='completed')task.status=enabled?'active':'paused';persist();render();toast(enabled?`已启用：${task.name}`:`已暂停：${task.name}`);}
function runTask(id){const task=tasks.find(item=>item.id===id);if(!task)return;const skill=task.name.includes('周报')?'weekly':task.name.includes('会议')?'meeting':task.name.includes('图片')?'image':'custom';const params=new URLSearchParams({skill,name:task.name,message:task.instruction,trigger:'scheduled',scheduledTaskId:task.id});location.href=`应用端_任务_执行结果.html?${params.toString()}`;}
function openRecords(id){const task=tasks.find(item=>item.id===id);if(!task)return;document.getElementById('record-title').textContent=task.name;document.getElementById('record-subtitle').textContent='运行记录与最近结果';document.getElementById('record-summary').innerHTML=`<div><span>执行计划</span><strong>${escapeHtml(scheduleText(task))}</strong></div><div><span>工作区</span><strong>${escapeHtml(task.workspace)}</strong></div>`;const runs=task.runs||[];document.getElementById('run-list').innerHTML=runs.length?runs.map(run=>{const icon=run.status==='success'?'circle-check':run.status==='failed'?'circle-x':'triangle-alert',cls=run.status==='success'?'':run.status==='failed'?'danger':'warning',label=run.status==='success'?'执行成功':run.status==='failed'?'执行失败':'已错过';return `<li class="run-item"><span class="run-icon ${cls}"><xianma-icon name="${icon}"></xianma-icon></span><span class="run-copy"><strong>${label}</strong><span>${escapeHtml(run.summary)}</span></span><time class="run-time">${escapeHtml(run.time)}</time></li>`;}).join(''):'<li class="empty-state" style="min-height:180px"><div><xianma-icon name="file"></xianma-icon><h2>尚无运行记录</h2><p>任务首次执行后会在这里留下结果</p></div></li>';document.getElementById('record-drawer').classList.add('show');}
function closeRecords(){document.getElementById('record-drawer').classList.remove('show');}
function requestDelete(){pendingDeleteId=editingId;document.getElementById('delete-modal').classList.add('show');}
function closeDelete(){pendingDeleteId='';document.getElementById('delete-modal').classList.remove('show');}
function confirmDelete(){const task=tasks.find(item=>item.id===pendingDeleteId);tasks=tasks.filter(item=>item.id!==pendingDeleteId);persist();document.getElementById('delete-modal').classList.remove('show');document.getElementById('task-modal').classList.remove('show');pendingDeleteId='';editingId='';render();toast(`已删除：${task?.name||'定时任务'}`);}
function toast(message){const host=document.getElementById('toast-host'),node=document.createElement('div');node.className='toast';node.textContent=message;host.appendChild(node);requestAnimationFrame(()=>node.classList.add('show'));setTimeout(()=>{node.classList.remove('show');setTimeout(()=>node.remove(),200);},2200);}
document.getElementById('task-date').addEventListener('change',updatePreview);document.getElementById('task-weekday').addEventListener('change',updatePreview);document.getElementById('task-time').addEventListener('change',updatePreview);document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(document.getElementById('delete-modal').classList.contains('show'))closeDelete();else if(document.getElementById('task-modal').classList.contains('show'))closeTaskModal();else closeRecords();});persist();syncFrequencyFields();render();
</script>
</body>
</html>
