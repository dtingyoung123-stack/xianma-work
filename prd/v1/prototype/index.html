<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
  // 目录式访问缺末尾斜杠时，相对跳转基准会错（.../prototype 会当成文件）。
  // 补上斜杠后重载，保证页内所有相对链接正确解析。
  (function(){
    var p = location.pathname;
    if (!/\.html?$/i.test(p) && !p.endsWith("/")) {
      location.replace(p + "/" + location.search + location.hash);
    }
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>先马·Centaur 登录页原型</title>
<style>
  :root{
    --bg-page:#e9eaec;
    --bg-window:#ffffff;
    --text:#1c2128;
    --text-dim:#6b7280;
    --border:#e5e7eb;
    --primary:#1c2128;
    --primary-hover:#333944;
    --secondary-border:#d8dadd;
    --secondary-hover:#f6f7f8;
    --input-border:#d8dadd;
    --input-focus:#2f6fed;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg-page);
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  }
  .window{
    width:600px;
    background:var(--bg-window);
    border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,0.18);
    overflow:hidden;
  }
  .titlebar{
    height:36px;
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:8px;
    border-bottom:1px solid var(--border);
  }
  .dot{
    width:12px;
    height:12px;
    border-radius:50%;
  }
  .dot.red{background:#ff5f57;}
  .dot.yellow{background:#febc2e;}
  .dot.green{background:#28c840;}

  .content{
    padding:72px 60px 90px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .logo{
    width:96px;
    height:96px;
    display:block;
    margin:0 auto 20px;
    object-fit:contain;
  }
  h1{
    font-size:24px;
    font-weight:600;
    color:var(--text);
    margin:0 0 40px;
  }
  .btn{
    width:100%;
    max-width:360px;
    height:48px;
    border-radius:10px;
    border:none;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .15s ease;
  }
  .btn-primary{
    background:var(--primary);
    color:#fff;
    margin-bottom:12px;
  }
  .btn-primary:hover{background:var(--primary-hover);}
  .btn-secondary{
    background:#fff;
    color:var(--text);
    border:1px solid var(--secondary-border);
  }
  .btn-secondary:hover{background:var(--secondary-hover);}

  .form{
    width:100%;
    max-width:360px;
    display:none;
    margin-top:4px;
  }
  .form.show{display:block;}
  .field{
    text-align:left;
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    height:44px;
    border:1px solid var(--input-border);
    border-radius:8px;
    padding:0 14px;
    font-size:14px;
    outline:none;
    color:var(--text);
  }
  .field input:focus{border-color:var(--input-focus);}
  .form-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .form-actions .btn{
    height:44px;
  }
  .btn-cancel{
    background:var(--secondary-hover);
    color:var(--text-dim);
    flex:1;
  }
  .btn-cancel:hover{background:#eceef0;}
  .btn-submit{
    background:var(--primary);
    color:#fff;
    flex:1;
  }
  .btn-submit:hover{background:var(--primary-hover);}

  .switch-link{
    margin-top:18px;
    font-size:13px;
    color:var(--text-dim);
    text-decoration:underline;
    cursor:pointer;
  }
  .register{
    margin-top:22px;
    font-size:13px;
    color:var(--text-dim);
    text-decoration:underline;
    cursor:pointer;
  }

  .note{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    color:#9aa0a6;
  }
  .toast-host{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
  .toast{background:rgba(28,33,40,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transform:translateY(-8px);transition:opacity .2s ease,transform .2s ease;}
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>

    <h1>开始使用 先马·Centaur</h1>

    <!-- 默认视图:钉钉登录入口 -->
    <div id="default-view" style="display:flex;flex-direction:column;align-items:center;width:100%;">
      <button class="btn btn-primary" style="max-width:360px;" onclick="location.href='main.html'">
        <span>💬</span> 使用钉钉登录
      </button>
      <button class="btn btn-secondary" style="max-width:360px;" onclick="showForm()">
        使用账号密码登录
      </button>
      <div class="register" onclick="toast('原型演示:请联系数智中心重置钉钉账号')">忘记密码</div>
    </div>

    <!-- 账号密码表单 -->
    <form class="form" id="password-form" onsubmit="return false;">
      <div class="field">
        <label>账号</label>
        <input type="text" placeholder="请输入账号">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" placeholder="请输入密码">
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" onclick="hideForm()">取消</button>
        <button type="submit" class="btn btn-submit" onclick="location.href='main.html'">登录</button>
      </div>
      <div class="switch-link" onclick="hideForm()" style="text-align:center;">返回钉钉登录</div>
    </form>
  </div>
</div>

<div class="note">原型 · 仅用于内部方案评审,非最终UI</div>
<div class="toast-host" id="toast-host"></div>

<script>
  function toast(msg){
    const host=document.getElementById('toast-host');
    const t=document.createElement('div');
    t.className='toast';t.textContent=msg;
    host.appendChild(t);
    requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),200);},2200);
  }
  function showForm(){
    document.getElementById('default-view').style.display = 'none';
    document.getElementById('password-form').classList.add('show');
  }
  function hideForm(){
    document.getElementById('default-view').style.display = 'flex';
    document.getElementById('password-form').classList.remove('show');
  }
</script>

</body>
</html>
